[package]
name = "atlas-tui"
version = "0.1.0"
edition = "2021"
description = "Ratatui client for the qlab owner runtime — Atlas-first, read-only"
license = "MIT"

# The crate keeps its published name; the binary the operator types is `atlas`.
# The library carries every module so integration tests can decode payloads and
# render frames without a terminal.
[lib]
name = "atlas"
path = "src/lib.rs"

[[bin]]
name = "atlas"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
anyhow = "1"
futures-util = "0.3.33"
tachyonfx = "0.25.1"
tui-big-text = "0.8.8"
throbber-widgets-tui = "0.11.1"
color-eyre = "0.6.5"
tracing = "0.1.44"
tracing-appender = "0.2.5"
unicode-width = "0.2.2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = true
strip = true

[dev-dependencies]
insta = "1.48.0"
