[package]
name = "atlas-tui"
version = "0.1.0"
edition = "2021"
description = "Ratatui client for the qlab owner runtime — Atlas-first, read-only"
license = "MIT"

# The crate keeps its published name; the binary the operator types is `atlas`.
# The library carries every module so integration tests can decode payloads and
# render frames without a terminal.
[lib]
name = "atlas"
path = "src/lib.rs"

# Two artifacts, and the default is the one an operator works at.
#
# The `operator` feature decides whether a write path is compiled into the
# binary at all: without it there is no `net::write`, no confirm modal, and no
# `Posture::Operator` — the read-only guarantee holds by absence, and no
# argument, environment variable, config file or bug can widen it, because the
# code that would widen it was never built. That guarantee is real, and it is
# now the property of the `--no-default-features` *monitoring* artifact
# specifically, not of every atlas binary in existence.
#
# The default ships armed because the desk this client serves is a desk a human
# works, and a workstation whose default build cannot approve, reject, or
# execute is a workstation the operator has to rebuild before they can act. What
# protects the armed artifact is not absence but the same three things that
# protect the Textual TUI: a confirm modal bound to the last six of the plan's
# own `targets_hash`, a referee PASS pinned to that hash, and an owner that
# re-validates every write and refuses without a persisted approval on record.
#
# The *posture* is no longer a build or a flag either — the owner persists it
# and serves it on `/api/tui`, and `store::Posture::from_desk` derives the scope
# from that snapshot. `--glass` remains as the operator's own veto: a window
# that declines an authority the desk is offering.
[features]
default = ["operator"]
operator = []

[[bin]]
name = "atlas"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3.33"
tachyonfx = "0.25.1"
tui-big-text = "0.8.8"
throbber-widgets-tui = "0.11.1"
color-eyre = "0.6.5"
tracing = "0.1.44"
tracing-appender = "0.2.5"
unicode-width = "0.2.2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
# `query` is what percent-encodes the stream's resume cursor. An ISO timestamp
# carries `+00:00`, and a raw `+` formatted into a url decodes to a space on the
# owner — a resume point silently off by the whole offset.
reqwest = { version = "0.13.4", features = ["json", "stream", "query"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = true
strip = true

[dev-dependencies]
insta = "1.48.0"
