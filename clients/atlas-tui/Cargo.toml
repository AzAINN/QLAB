[package]
name = "atlas-tui"
version = "0.1.0"
edition = "2021"
description = "Ratatui client for the qlab owner runtime — Atlas-first, read-only"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
anyhow = "1"

[profile.release]
lto = true
strip = true
