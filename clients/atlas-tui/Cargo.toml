[package]
name = "atlas-tui"
version = "0.1.0"
edition = "2021"
description = "Ratatui client for the qlab owner runtime — Atlas-first, read-only"
license = "MIT"

# The crate keeps its published name; the binary the operator types is `atlas`.
# The library carries every module so integration tests can decode payloads and
# render frames without a terminal.
[lib]
name = "atlas"
path = "src/lib.rs"

# The operator posture is a build, not a setting.
#
# CLAUDE.md invariant 3 forbids an agent-reachable execution path, and this
# client's claim has always been the stronger one: "read-only by construction —
# no order path, no registry handle — so invariant 3 holds there by absence".
# A runtime `Option<WriteClient>` would demote that to a branch, and a branch
# can be flipped by a flag, a config file, or a bug. Under this feature the
# write half does not exist in the artifact: the default build has no POST call
# site to reach, mis-set, or exploit.
#
# `--operator` gates *activation* on top of it. The feature says what the binary
# is capable of; the flag says whether the operator armed it. A monitoring box
# runs the default build and cannot be talked into writing at all.
[features]
default = []
operator = []

[[bin]]
name = "atlas"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3.33"
tachyonfx = "0.25.1"
tui-big-text = "0.8.8"
throbber-widgets-tui = "0.11.1"
color-eyre = "0.6.5"
tracing = "0.1.44"
tracing-appender = "0.2.5"
unicode-width = "0.2.2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
# `query` is what percent-encodes the stream's resume cursor. An ISO timestamp
# carries `+00:00`, and a raw `+` formatted into a url decodes to a space on the
# owner — a resume point silently off by the whole offset.
reqwest = { version = "0.13.4", features = ["json", "stream", "query"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = true
strip = true

[dev-dependencies]
insta = "1.48.0"
