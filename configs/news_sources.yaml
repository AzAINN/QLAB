# Curated, read-only news sources for the bounded qualitative research lane.
# A source either maps every item to fixed tickers or applies keyword rules.
#
# Every URL here was reachable when last verified (2026-07-25). The rss
# provider fails loud if ANY feed is unreachable — that is deliberate, so a
# silently shrinking news window can never masquerade as a quiet market. If a
# feed dies, fix or remove it here rather than letting the lane degrade.
feeds:
  - name: Federal Reserve
    url: https://www.federalreserve.gov/feeds/press_all.xml
    tickers: [BNDW, EMB, IGF]

  - name: European Central Bank
    url: https://www.ecb.europa.eu/rss/press.html
    tickers: [BNDW, EMB, IGF]

  - name: EIA Today in Energy
    url: https://www.eia.gov/rss/todayinenergy.xml
    tickers: [GSG]

  - name: Nareit News
    url: https://www.reit.com/rss.xml
    tickers: [VNQ]

  - name: CNBC Markets
    url: https://www.cnbc.com/id/20910258/device/rss/rss.html
    keywords:
      - terms: [global market, world stocks, equities, shares, stock market,
                s&p, nasdaq, dow]
        tickers: [ACWI]
      - terms: [commodity, commodities, crude oil, energy market, opec]
        tickers: [GSG]
      - terms: [gold, precious metal, bullion]
        tickers: [GLD]
      - terms: [real estate, property market, REIT, housing]
        tickers: [VNQ]
      - terms: [treasury, bond, yield, fed, inflation, rate cut, rate hike]
        tickers: [BNDW]
      - terms: [emerging market, china, india, brazil]
        tickers: [EMB]
      - terms: [infrastructure, utilities, pipeline]
        tickers: [IGF]

  - name: MarketWatch Top Stories
    url: http://feeds.marketwatch.com/marketwatch/topstories/
    keywords:
      - terms: [stocks, equities, market, s&p, nasdaq, dow]
        tickers: [ACWI]
      - terms: [oil, commodity, commodities, energy]
        tickers: [GSG]
      - terms: [gold, silver, bullion]
        tickers: [GLD]
      - terms: [treasury, bond, yield, inflation, fed]
        tickers: [BNDW]
      - terms: [real estate, housing, REIT]
        tickers: [VNQ]

# These are deterministic fixtures, not cached or simulated live headlines.
# The provider picks one template per requested ticker and timestamps it from a
# stable hash of as_of + the canonical universe.
synthetic:
  ACWI:
    - source: qlab synthetic global markets
      headline: Global equity volatility broadens across regions
      summary: Cross-region equity markets show wider dispersion and a busier volatility backdrop.
      url: synthetic://qlab/acwi/global-volatility
    - source: qlab synthetic global markets
      headline: Global market breadth narrows as risk conditions shift
      summary: Market breadth and cross-region dispersion are the main risk context in the latest synthetic digest.
      url: synthetic://qlab/acwi/market-breadth

  BNDW:
    - source: qlab synthetic central banks
      headline: Central-bank guidance keeps the global rate path uncertain
      summary: Policy-rate uncertainty remains relevant to duration and global aggregate bond volatility.
      url: synthetic://qlab/bndw/rate-path
    - source: qlab synthetic fixed income
      headline: Global yield curves show uneven policy expectations
      summary: Diverging policy expectations add duration and correlation risk across developed bond markets.
      url: synthetic://qlab/bndw/yield-curves

  EMB:
    - source: qlab synthetic credit
      headline: Emerging sovereign spreads respond to tighter liquidity
      summary: Funding conditions and spread dispersion remain the principal risk context for emerging-market debt.
      url: synthetic://qlab/emb/spreads
    - source: qlab synthetic credit
      headline: Dollar funding conditions reshape emerging-market bond risk
      summary: Currency funding and sovereign spread sensitivity are elevated in the synthetic credit brief.
      url: synthetic://qlab/emb/dollar-funding

  GSG:
    - source: qlab synthetic commodities
      headline: Energy inventories amplify broad commodity dispersion
      summary: Uneven inventory conditions increase volatility differences across the broad commodity complex.
      url: synthetic://qlab/gsg/inventories
    - source: qlab synthetic commodities
      headline: Supply uncertainty widens moves across commodity sectors
      summary: Energy and industrial inputs show a more varied risk profile as supply conditions change.
      url: synthetic://qlab/gsg/supply

  IGF:
    - source: qlab synthetic infrastructure
      headline: Financing costs remain central to infrastructure risk
      summary: Long-duration infrastructure assets face a mixed rate and policy backdrop across regions.
      url: synthetic://qlab/igf/financing
    - source: qlab synthetic infrastructure
      headline: Infrastructure policy pipelines vary across major regions
      summary: Project timing and financing conditions create uneven risk across global infrastructure assets.
      url: synthetic://qlab/igf/policy

  GLD:
    - source: qlab synthetic metals
      headline: Real-yield uncertainty lifts gold-market volatility
      summary: Shifts in real yields and defensive demand form the current synthetic gold risk context.
      url: synthetic://qlab/gld/real-yields
    - source: qlab synthetic metals
      headline: Gold trading reflects competing rate and haven pressures
      summary: Rate sensitivity and safe-haven demand pull gold risk conditions in different directions.
      url: synthetic://qlab/gld/haven-demand

  VNQ:
    - source: qlab synthetic real estate
      headline: Property financing conditions diverge across segments
      summary: Refinancing costs and occupancy differences widen risk dispersion across listed real estate.
      url: synthetic://qlab/vnq/financing
    - source: qlab synthetic real estate
      headline: Listed real-estate risk centers on refinancing schedules
      summary: Debt maturities and segment-level fundamentals shape the latest synthetic property risk brief.
      url: synthetic://qlab/vnq/refinancing

  SPY:
    - source: qlab synthetic us equity
      headline: US large-cap leadership narrows into the close
      summary: Index-level breadth and concentration are the stated risk context for US large caps.
      url: synthetic://qlab/spy/us-breadth
    - source: qlab synthetic index desk
      headline: Passive flows steady as US benchmark volatility eases
      summary: Benchmark flow and realized-volatility context for the US large-cap complex.
      url: synthetic://qlab/spy/index-flows

  QQQ:
    - source: qlab synthetic tech desk
      headline: Growth leadership concentrates in a narrowing cohort
      summary: Concentration in large-cap growth is the dominant dispersion story this window.
      url: synthetic://qlab/qqq/growth-concentration
    - source: qlab synthetic us equity
      headline: Rate sensitivity returns to long-duration equity
      summary: Duration-sensitive equity reprices as the policy path is re-read.
      url: synthetic://qlab/qqq/duration-equity

  IWM:
    - source: qlab synthetic us equity
      headline: Small caps lag as credit conditions tighten
      summary: Small-cap breadth tracks credit availability rather than index-level risk appetite.
      url: synthetic://qlab/iwm/smallcap-credit
    - source: qlab synthetic index desk
      headline: Domestic cyclicals diverge from megacap leadership
      summary: Cyclical and megacap return paths separate, widening cross-sectional dispersion.
      url: synthetic://qlab/iwm/cyclical-divergence

  EEM:
    - source: qlab synthetic emerging markets
      headline: Emerging equity tracks dollar and policy differentials
      summary: EM equity risk is framed by currency and relative-policy context.
      url: synthetic://qlab/eem/em-dollar
    - source: qlab synthetic global markets
      headline: Regional dispersion widens across emerging markets
      summary: Country-level dispersion within EM widens relative to developed markets.
      url: synthetic://qlab/eem/em-dispersion

  TLT:
    - source: qlab synthetic rates desk
      headline: Long-duration Treasuries repricing on term-premium shifts
      summary: Term premium rather than the policy rate drives the long end this window.
      url: synthetic://qlab/tlt/term-premium
    - source: qlab synthetic fixed income
      headline: Duration demand shifts with auction supply
      summary: Supply and duration demand are the stated context for the long end.
      url: synthetic://qlab/tlt/auction-supply

  IEF:
    - source: qlab synthetic rates desk
      headline: Intermediate Treasuries anchor to the expected policy path
      summary: The belly of the curve reflects expected policy over the coming cycle.
      url: synthetic://qlab/ief/policy-anchor
    - source: qlab synthetic fixed income
      headline: Belly of the curve steepens against the front end
      summary: Curve shape between the front end and the belly is the reported development.
      url: synthetic://qlab/ief/belly-steepening

  TIP:
    - source: qlab synthetic inflation desk
      headline: Breakevens drift as real yields lead nominal moves
      summary: Real yields and breakeven inflation are the framing for index-linked exposure.
      url: synthetic://qlab/tip/breakevens
    - source: qlab synthetic rates desk
      headline: Inflation-linked demand tracks realized price data
      summary: Index-linked demand follows realized rather than surveyed inflation.
      url: synthetic://qlab/tip/linked-demand

  LQD:
    - source: qlab synthetic credit desk
      headline: Investment-grade spreads compress on steady issuance
      summary: IG spread context with issuance and duration composition noted.
      url: synthetic://qlab/lqd/ig-spreads
    - source: qlab synthetic fixed income
      headline: High-grade credit duration lengthens with new supply
      summary: New issuance shifts the duration profile of the high-grade index.
      url: synthetic://qlab/lqd/ig-duration

  HYG:
    - source: qlab synthetic credit desk
      headline: High-yield spreads widen ahead of refinancing walls
      summary: Refinancing supply is the stated risk context for high yield.
      url: synthetic://qlab/hyg/hy-refi
    - source: qlab synthetic risk desk
      headline: Lower-rated credit decouples from investment grade
      summary: Rating-tier dispersion within credit is the reported development.
      url: synthetic://qlab/hyg/hy-decoupling

  SLV:
    - source: qlab synthetic metals
      headline: Silver tracks both industrial demand and haven flows
      summary: Silver carries a dual industrial and monetary framing this window.
      url: synthetic://qlab/slv/silver-dual
    - source: qlab synthetic commodities desk
      headline: Precious-metals ratios move with real-rate expectations
      summary: Cross-metal ratios are read against real-rate expectations.
      url: synthetic://qlab/slv/metals-ratios

  DBC:
    - source: qlab synthetic commodities desk
      headline: Diversified commodity baskets diverge by sector weight
      summary: Index construction drives dispersion across commodity baskets.
      url: synthetic://qlab/dbc/basket-weights
    - source: qlab synthetic macro desk
      headline: Carry and roll dominate commodity index returns
      summary: Roll yield rather than spot direction is the reported return driver.
      url: synthetic://qlab/dbc/roll-carry

  USO:
    - source: qlab synthetic energy desk
      headline: Crude curves shift between contango and backwardation
      summary: Term structure is the reported context for oil-linked exposure.
      url: synthetic://qlab/uso/crude-curve
    - source: qlab synthetic commodities desk
      headline: Energy inventories reset the near-dated curve
      summary: Inventory data is the stated driver of near-dated energy pricing.
      url: synthetic://qlab/uso/energy-inventories

  RWO:
    - source: qlab synthetic real assets
      headline: Global property yields diverge by region
      summary: Regional cap-rate dispersion is the reported real-estate development.
      url: synthetic://qlab/rwo/global-property
    - source: qlab synthetic real estate
      headline: Listed real estate reprices against long rates
      summary: Listed property is read against the long end rather than the policy rate.
      url: synthetic://qlab/rwo/reit-rates

# SEC EDGAR: the funds themselves always; the issuers below are the operator's
# curated constituent list per ETF — phase-one holdings knowledge, shared as
# data. Requires QLAB_EDGAR_CONTACT in .env (the SEC asks who is calling).
edgar:
  issuers:
    QQQ: [AAPL, MSFT, NVDA, AMZN, META, AVGO, GOOGL, TSLA]
    SPY: [AAPL, MSFT, NVDA, AMZN, META, BRK-B, GOOGL, JPM]

# Official releases: the publisher IS the event, so every record here is
# primary-tier by name (see grounding.PRIMARY_SOURCE_MARKERS).
macro:
  feeds:
    - name: BLS
      url: https://www.bls.gov/feed/bls_latest.rss
      tickers: [TIP, BNDW]
    - name: Bureau of Economic Analysis
      url: https://apps.bea.gov/rss/rss.xml
      tickers: [ACWI, BNDW]
    - name: US Treasury
      url: https://home.treasury.gov/news/press-releases/rss
      tickers: [TLT, IEF, BNDW]

# Scheduled releases. Dated in the future on purpose and never served as
# news — they are what Atlas reads as "what is coming". Maintain per quarter.
calendar:
  - {name: FOMC statement, when: "2026-09-17T18:00:00+00:00", tickers: [BNDW, TLT, IEF], source: Federal Reserve}
  - {name: CPI (August), when: "2026-09-11T12:30:00+00:00", tickers: [TIP, BNDW], source: BLS}
  - {name: Employment situation (August), when: "2026-09-04T12:30:00+00:00", tickers: [BNDW, ACWI], source: BLS}
