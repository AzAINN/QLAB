# ---------------------------------------------------------------------------
# Batch-mode experiment spec — the SUBMISSION NUMBERS.
#
# In batch mode an agent *authors* this declarative spec and the engine
# executes it deterministically. Headline results must survive
# `git clone && qlab batch configs/specs/ablation_v1.yaml`. This is the direct
# answer to TradingAgents' concession that its results aren't reproducible
# (research-plan §2.3, §6 experiment matrix).
#
# Everything hangs on holding all else constant and varying ONE thing (the
# objective, or the solver). Arms are content-hashed into the registry so the
# trial count feeds the deflated-Sharpe calculation as a schema feature.
# ---------------------------------------------------------------------------

name: ablation_v1
seed: 7

data:
  # Pinned BY VALUE, deliberately. These seven names are the published
  # submission numbers; resolving a tier name at runtime would let a later
  # universe edit silently redefine them, and the synthetic panel re-partitions
  # when n changes, so the change would not even be visible as a diff.
  tickers: [ACWI, BNDW, GSG, IGF, GLD, VNQ, EMB]
  start: "2008-01-01"
  end: "2024-12-31"
  # If offline / no network, the engine serves the synthetic generator seeded
  # from `seed` so the ablation still runs end-to-end.
  offline_ok: true

backtest:
  rebalance: quarterly      # ~70 quarterly points from 2008 — a SMALL sample.
  lookback_days: 756        # ~3y estimation window (an agent-judgment slot)
  cost_bps: 5               # per-side transaction cost in basis points

moments:
  shrinkage: ledoit_wolf    # covariance shrinkage target
  denoise: marchenko_pastur # RMT eigenvalue cleaning
  comoment_shrinkage: auto  # tensor-size/sample-size driven delta3 and delta4
  comoment_target: one_factor # preserve common-factor skew and excess kurtosis

# The experiment matrix (research-plan §6). Each arm = one (objective, solver).
arms:
  - id: B0                  # institutional benchmark
    objective: sixty_forty
    solver: none
  - id: B1                  # naive benchmark — famously hard to beat
    objective: equal_weight
    solver: none
  - id: B2                  # THE REAL BAR — robust to estimation error
    objective: hrp
    solver: hrp
  - id: B3                  # practitioner benchmark
    objective: risk_parity
    solver: risk_parity
  - id: A1                  # classical min-variance baseline
    objective: min_variance
    solver: classical
  - id: B4                  # regime-conditional min-variance (lambda-mixed cov)
    objective: min_variance
    solver: classical
    params: { regime_conditional: true }
  - id: A5                  # views-conditioned min-variance (qualitative matrix)
    # RESEARCH-STAGE (`views_conditioned_min_variance` is not operational, so
    # nothing here can reach a governed solve). Everything is held constant
    # against A1 except the covariance: at each rebalance the point-in-time
    # news window becomes a qualitative matrix, two bounded rules turn its
    # counts into unsigned risk views, and entropy pooling tilts Sigma under a
    # KL budget with every mean pinned. If the record says nothing, the arm
    # reproduces A1 exactly — and that is the comparison, not a failure.
    #
    # CONFOUND, stated rather than engineered away: when a rule fires, the
    # conditioned covariance is the probability-weighted SAMPLE covariance of
    # the panel, so this arm swaps A1's Ledoit-Wolf-shrunk, MP-denoised
    # estimator for a raw one at the same moment it applies the views. A5-vs-A1
    # therefore measures views AND estimator together, exactly as B4's
    # lambda-mixed covariance does. Tilting the shrunk estimator instead is a
    # promotion-time design question, not a fix to make here: it would change
    # what `views_conditioned_min_variance` means before any evidence says the
    # entry earns a place at all.
    objective: min_variance
    solver: classical
    params: { views_source: qualitative_matrix }
  - id: A2                  # THE FALSIFIABLE RIVAL — uses the distribution directly
    objective: scenario_cvar
    solver: cvar_lp
  - id: A3                  # OBJECTIVE CLAIM — do higher moments help?
    objective: mvsk
    solver: classical_multistart
    params: { skew_lambda: 0.5, kurt_lambda: 0.5 }
  - id: A4                  # SOLVER CLAIM — does the hardware find better optima?
    objective: mvsk
    solver: dirac3          # requires QCI account; falls back to classical_multistart
    params: { skew_lambda: 0.5, kurt_lambda: 0.5 }
  - id: A3t                 # RESEARCH-ONLY — A3 + volatility-targeting overlay.
    # target_vol scales exposure by min(1, target_vol/est_vol): long-only, no
    # leverage, un-invested remainder is implicit cash (weights sum < 1). The
    # backtest drift loop preserves that cash share through each period
    # (cash earns 0, not re-levered back to full investment daily), so the
    # overlay genuinely de-risks. This breaks the fully-invested mandate on
    # purpose, so A3t CANNOT reach the trader, and `research_only: true`
    # keeps it out of the DSR trial count too — it exists to measure the
    # overlay's effect on realised vol only, not to be counted as a live
    # candidate.
    objective: mvsk
    solver: classical_multistart
    params: { skew_lambda: 0.5, kurt_lambda: 0.5, target_vol: 0.08, research_only: true }

metrics:
  - ann_return
  - ann_vol
  - sortino
  - max_drawdown
  - cvar_95
  - turnover
  - realized_skew        # did optimizing tail shape actually deliver tail shape?
  - realized_kurtosis
  - deflated_sharpe      # uses the registry trial count
