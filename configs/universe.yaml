# The 23-ETF candidate pool for wider-universe and offline selection research.
# `core` tickers are a subset; the selector should be able to (re)discover
# a well-diversified k≈7 basket out of the wider set.
candidates:
  - ACWI    # global equity
  - SPY     # US large cap
  - EFA     # developed ex-US equity
  - EEM     # emerging equity
  - IWM     # US small cap
  - BNDW    # global bonds
