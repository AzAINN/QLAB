# ---------------------------------------------------------------------------
# Investable universe.
#
# The core universe is 20 CROSS-ASSET ETFs, not sector SPDRs. Sector SPDRs are
# dominated by shared equity beta; the cross-asset basket supplies more varied
# correlation and regime behavior for allocation research.
#
# The `candidates` set (23 ETFs) supports wider-universe stress tests and an
# explicitly offline asset-selection experiment.
#
# Why 20 and not 7: cardinality over the tradable set is only a decision when
# n > k. At n=7, k=7 there is exactly one combination, so `select_k_of_n`
# returns the whole universe and its redundancy term never trades anything off.
# At n=20, k=7 it enumerates C=77,520 in ~0.03s and returns a chosen basket.
#
# Why not more: MAX_EXACT_ASSETS = 25 in qlab/core/selection.py is a hard
# ceiling on exact enumeration, and the MVSK cokurt tensor is n^4 — 3.1 MB at
# n=25, 104 MB at n=60. 20 leaves headroom under both.
# ---------------------------------------------------------------------------

# Benchmark definitions (arms B0 / B1).
benchmarks:
  sixty_forty:            # B0 — the clean institutional comparison
    ACWI: 0.60            # global equity
    BNDW: 0.40            # global bonds
  # B1 (equal-weight 1/N) is derived from `core` at runtime.

# The primary ~7-asset cross-asset core for staged allocation experiments.
core:
  - ticker: ACWI        # global equities
    name: iShares MSCI ACWI
    asset_class: equity
  - ticker: SPY         # US large cap
    name: SPDR S&P 500
    asset_class: equity
  - ticker: QQQ         # US large-cap growth
    name: Invesco QQQ
    asset_class: equity
  - ticker: IWM         # US small cap
    name: iShares Russell 2000
    asset_class: equity
  - ticker: EEM         # emerging equity
    name: iShares MSCI Emerging Markets
    asset_class: equity
  - ticker: BNDW        # global aggregate bonds
    name: Vanguard Total World Bond
    asset_class: bonds
