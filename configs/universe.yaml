    asset_class: em_bonds
  - ticker: GLD         # gold
    name: SPDR Gold Shares
    asset_class: gold
  - ticker: SLV         # silver
    name: iShares Silver Trust
    asset_class: precious_metals
  - ticker: GSG         # broad commodities
    name: iShares S&P GSCI Commodity
    asset_class: commodities
  - ticker: DBC         # diversified commodities
