# ---------------------------------------------------------------------------
# Trading mandate — the hard, deterministic contract the autopilot operates
# under. Enforced IN CODE (qlab/trader/mandate.py), never by prompt.
#
# "Give the agent $10k" does NOT mean the agent watches tickers and makes
# calls. It means: the lab produces a validated policy; the agent operates
# that policy under this mandate. Every limit below is checked before any
# order plan can move from `proposed` to `checked` (research-plan §8).
# ---------------------------------------------------------------------------

account:
  paper_capital: 10000.0        # USD. Paper only. Live is UNIMPLEMENTED.
  base_currency: USD

# Only these tickers may ever appear in a target. Anything else is rejected.
# universe_tier: extended       # Optional: resolve this list from configs/universe.yaml.
universe_whitelist:
  - ACWI
  - SPY
  - QQQ
  - IWM
  - EEM
  - BNDW
  - TLT
  - IEF
  - TIP
  - LQD
  - HYG
  - EMB
  - GLD
  - SLV
  - GSG
  - DBC
  - USO
  - IGF
  - VNQ
  - RWO

constraints:
  long_only: true               # no shorts
  fully_invested: true          # weights sum to 1 (cash buffer handled separately)
  max_weight_per_asset: 0.40    # per-asset cap
  min_weight_per_asset: 0.0
  max_turnover_per_rebalance: 0.50   # sum |Δw| capped per rebalance
  max_gross_exposure: 1.0       # abs-sum, so the cap also covers future shorts
  stress_vol_limit: 0.30        # annualized correlation-to-one warning threshold
  # 60, not 20: a full rebalance across a 20-name universe can need a sell and
  # a buy leg per name plus retries, and the cap is a circuit breaker against a
  # runaway loop — not a portfolio-construction constraint. Left at 20 it would
  # refuse the defensive basket below, which is exactly when it must not.
  max_orders_per_day: 60
  order_type: marketable_limit  # never plain market orders

# Pre-kill-switch drawdown controls. These tiers inform the referee before the
# existing trailing-drawdown kill switch fires as the final backstop.
drawdown_tiers:
  warning_pct: 0.05
  control_pct: 0.10
  breaker_pct: 0.15

# Trailing-drawdown kill-switch. Past this drawdown from the high-water mark,
# the server refuses every non-liquidating order and pages the human.
kill_switch:
  trailing_drawdown_pct: 0.15   # 15% peak-to-trough

# Rebalance triggers (checked by the daily ops session; no trigger => heartbeat).
rebalance:
  cadence: quarterly            # scheduled cadence
  drift_band_pct: 0.05          # rebalance if any asset drifts > 5% from target
  regime_triggered: true        # also rebalance on a regime flip

# Pre-validated risk-off proposal used only when the robust regime is stress
# or uncertain. It is still a proposal: the referee, cost gate, and explicit
# human confirmation remain mandatory before any paper order can execute.
# Every weight names a whitelisted ticker: the risk-off basket must be
# executable under the same mandate as any other target, or it is decorative.
defensive_targets:
  BNDW: 0.20
  TLT: 0.14
  IEF: 0.12
  TIP: 0.10
  LQD: 0.06
  GLD: 0.20
  ACWI: 0.06
  SPY: 0.04
  EMB: 0.03
  IGF: 0.02
  VNQ: 0.02
  RWO: 0.01

# Fractional / notional orders are required — whole shares of a $250 ETF give
# ~2.5% weight granularity, which would make the optimized weights fiction.
execution:
  allow_fractional: true

# Display and research estimates use a half-spread plus square-root impact model.
# ADV overrides are optional; an unlisted core ETF uses the conservative default.
costs:
  spread_bps: 2.0
  commission_bps: 0.0
  impact_k: 1.0
  adv_notional:
    default: 50000000.0
    # ACWI: 250000000.0       # optional per-ticker trailing-ADV fallback

# Deployment is evidence-led, not novelty-led. MVSK stays in the research
# ablation until it earns promotion; the paper desk starts from the robust HRP
# benchmark that currently wins out of sample.
allocation:
  operational_policy: hrp
