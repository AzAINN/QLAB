[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qlab"
version = "0.1.0"
description = "An agentic quant research lab that promotes its own validated policy into a mandated paper-trading autopilot. Quantum applied only where its structure fits; the LLM applied only where judgment is required; deterministic code owns rigor."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Quant Lab" }]
keywords = ["quant", "portfolio-optimization", "quantum", "qiskit", "agents", "mcp"]

# ---------------------------------------------------------------------------
# Core dependencies are intentionally LIGHT and reliable.  The pure-Python
# quant core, DuckDB registry, mock/classical solvers, backtester and the
# autopilot all run with only these.  Everything heavy (Qiskit, CVXPY,
# yfinance, Alpaca, FastMCP) is an *optional extra* that is imported lazily,
# so the system degrades gracefully and the offline demo cannot be taken
# down by a missing wheel or a rate-limited data feed.
# ---------------------------------------------------------------------------
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "pydantic>=2.5",
    "duckdb>=0.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Live market data (yfinance). Without it, qlab serves the offline synthetic
# generator and the parquet cache — the demo still runs.
data = ["yfinance>=0.2.40", "pyarrow>=15.0"]

# Classical convex solver path (faster / cleaner than the scipy fallback).
optimize = ["cvxpy>=1.4"]

# Quantum research arm. Pinned to the version set the spec found to work
# together; Aer's V2 primitives + qiskit-algorithms 0.4 + optimization 0.7.
quantum = [
    "qiskit>=1.2",
    "qiskit-aer>=0.15",
    "qiskit-algorithms>=0.3",
    "qiskit-optimization>=0.6",
]

# Model Context Protocol servers (orchestrator-facing).
mcp = ["fastmcp>=2.0"]

# Terminal operator console. Kept optional so the quant core remains light.
tui = ["textual>=0.60", "httpx>=0.27"]

# Complete operator surface: TUI plus the stateless Claude MCP proxy.
operator = ["textual>=0.60", "httpx>=0.27", "fastmcp>=2.0"]

# Execution gateway. Alpaca paper trading (live is unimplemented by design).
trader = ["alpaca-py>=0.20"]

# Plotting for the scaling / ablation charts.
viz = ["matplotlib>=3.8"]

dev = ["pytest>=8.0", "pytest-cov>=4.1"]

all = [
    "qlab[data,optimize,quantum,mcp,trader,viz,tui,dev]",
]

[project.scripts]
# Standalone autopilot — runnable with no Claude/Bob session at all.
qlab = "qlab.autopilot.cli:main"

[tool.setuptools.packages.find]
include = ["qlab*"]

[tool.setuptools.package-data]
"qlab.ui" = ["index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
