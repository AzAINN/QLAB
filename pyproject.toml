[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qlab"
version = "0.1.0"
description = "A governed quantitative research lab and mandated paper-trading workstation with a staged algorithm catalog and propose-only agent workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Quant Lab" }]
keywords = ["quant", "portfolio-optimization", "governance", "algorithm-catalog", "agents", "mcp"]

# ---------------------------------------------------------------------------
# Core dependencies are intentionally LIGHT and reliable.  The pure-Python
# quant core, DuckDB registry, classical solvers, backtester and the autopilot
# all run with only these. Everything heavy (CVXPY, yfinance, Alpaca, FastMCP)
# is an *optional extra* that is imported lazily,
# so the system degrades gracefully and the offline demo cannot be taken
# down by a missing wheel or a rate-limited data feed.
# ---------------------------------------------------------------------------
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "pydantic>=2.5",
    "duckdb>=0.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Live market data (yfinance). Without it, qlab serves the offline synthetic
# generator and the parquet cache — the demo still runs.
data = ["yfinance>=0.2.40", "pyarrow>=15.0"]

# Classical convex solver path (faster / cleaner than the scipy fallback).
optimize = ["cvxpy>=1.4"]

# Offline quantum research only. These dependencies are intentionally excluded
# from the staged runtime and the all extra; opt in for isolated experiments.
offline-quantum = [
    "qiskit>=1.2",
    "qiskit-aer>=0.15",
    "qiskit-algorithms>=0.3",
    "qiskit-optimization>=0.6",
]

# Model Context Protocol servers (orchestrator-facing).
mcp = ["fastmcp>=2.0"]

# Terminal operator console. Kept optional so the quant core remains light.
tui = ["textual>=0.60", "httpx>=0.27"]

# Complete operator surface: TUI plus the stateless Claude MCP proxy.
operator = ["textual>=0.60", "httpx>=0.27", "fastmcp>=2.0"]

# Execution gateway. Alpaca paper trading (live is unimplemented by design).
trader = ["alpaca-py>=0.20"]

# Plotting for the scaling / ablation charts.
viz = ["matplotlib>=3.8"]

dev = ["pytest>=8.0", "pytest-cov>=4.1"]

all = [
    "qlab[data,optimize,mcp,trader,viz,tui,dev]",
]

[project.scripts]
# Standalone autopilot — runnable with no Claude/Bob session at all.
qlab = "qlab.autopilot.cli:main"

[tool.setuptools.packages.find]
include = ["qlab*"]

[tool.setuptools.package-data]
"qlab.ui" = ["index.html"]

[tool.setuptools.data-files]
"share/qlab" = ["mandate.yaml"]
"share/qlab/configs" = ["configs/universe.yaml"]
"share/qlab/configs/specs" = ["configs/specs/*.yaml"]
"share/qlab/agents" = ["agents/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
